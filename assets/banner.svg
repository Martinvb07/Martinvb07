<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="380" viewBox="0 0 1200 380" fill="none">
  <defs>
    <linearGradient id="name" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#34d399"/>
      <stop offset="0.55" stop-color="#22d3ee"/>
      <stop offset="1" stop-color="#a3e635"/>
    </linearGradient>
    <radialGradient id="glow1" cx="0" cy="0" r="1" gradientUnits="userSpaceOnUse" gradientTransform="translate(180 60) scale(420 300)">
      <stop stop-color="#10b981" stop-opacity="0.28"/>
      <stop offset="1" stop-color="#10b981" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glow2" cx="0" cy="0" r="1" gradientUnits="userSpaceOnUse" gradientTransform="translate(1000 340) scale(420 280)">
      <stop stop-color="#06b6d4" stop-opacity="0.22"/>
      <stop offset="1" stop-color="#06b6d4" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M32 0H0V32" stroke="#1f2a37" stroke-width="1"/>
    </pattern>
    <clipPath id="card"><rect width="1200" height="380" rx="20"/></clipPath>
    <style>
      .sans { font-family: 'Segoe UI', -apple-system, BlinkMacSystemFont, Helvetica, Arial, sans-serif; }
      .mono { font-family: 'SFMono-Regular', Consolas, 'Liberation Mono', Menlo, monospace; }
      .line { opacity: 0; animation: show .4s ease-out forwards; }
      .l1 { animation-delay: .3s } .l2 { animation-delay: .9s } .l3 { animation-delay: 1.5s }
      .l4 { animation-delay: 2.1s } .l5 { animation-delay: 2.7s } .l6 { animation-delay: 3.3s }
      .l7 { animation-delay: 3.9s }
      .cursor { animation: blink 1s steps(1) infinite; }
      .pulse { animation: pulse 2s ease-in-out infinite; }
      @keyframes show { from { opacity: 0; transform: translateY(4px) } to { opacity: 1; transform: none } }
      @keyframes blink { 50% { opacity: 0 } }
      @keyframes pulse { 0%,100% { opacity: 1 } 50% { opacity: .35 } }
    </style>
  </defs>

  <g clip-path="url(#card)">
    <rect width="1200" height="380" fill="#0a0f14"/>
    <rect width="1200" height="380" fill="url(#grid)" opacity="0.55"/>
    <rect width="1200" height="380" fill="url(#glow1)"/>
    <rect width="1200" height="380" fill="url(#glow2)"/>
  </g>
  <rect x="0.5" y="0.5" width="1199" height="379" rx="19.5" stroke="#1f2a37"/>

  <!-- Izquierda -->
  <g class="sans">
    <rect x="64" y="70" width="252" height="30" rx="15" fill="#10b981" fill-opacity="0.12" stroke="#10b981" stroke-opacity="0.45"/>
    <circle cx="84" cy="85" r="5" fill="#34d399" class="pulse"/>
    <text x="98" y="90" fill="#6ee7b7" font-size="14" font-weight="600">Disponible para proyectos</text>

    <text x="62" y="170" fill="url(#name)" font-size="64" font-weight="800" letter-spacing="-1.5">Martín Velásquez</text>
    <text x="64" y="212" fill="#e5e7eb" font-size="23" font-weight="600">Full Stack &amp; Mobile Developer</text>
    <text x="64" y="244" fill="#94a3b8" font-size="17">Fundador de Llano Studio · Villavicencio, Colombia</text>

    <g transform="translate(64 284)" font-size="13" font-weight="600">
      <rect width="92" height="28" rx="8" fill="#111827" stroke="#273244"/>
      <text x="46" y="19" text-anchor="middle" fill="#cbd5e1">Next.js</text>
      <rect x="102" width="84" height="28" rx="8" fill="#111827" stroke="#273244"/>
      <text x="144" y="19" text-anchor="middle" fill="#cbd5e1">NestJS</text>
      <rect x="196" width="84" height="28" rx="8" fill="#111827" stroke="#273244"/>
      <text x="238" y="19" text-anchor="middle" fill="#cbd5e1">Flutter</text>
      <rect x="290" width="96" height="28" rx="8" fill="#111827" stroke="#273244"/>
      <text x="338" y="19" text-anchor="middle" fill="#cbd5e1">MongoDB</text>
      <rect x="396" width="84" height="28" rx="8" fill="#111827" stroke="#273244"/>
      <text x="438" y="19" text-anchor="middle" fill="#cbd5e1">Docker</text>
    </g>
  </g>

  <!-- Terminal -->
  <g transform="translate(676 58)">
    <rect width="462" height="264" rx="14" fill="#0d1117" stroke="#263241"/>
    <path d="M0 14C0 6.268 6.268 0 14 0h434c7.732 0 14 6.268 14 14v24H0V14Z" fill="#141b24"/>
    <circle cx="22" cy="19" r="6" fill="#ff5f57"/>
    <circle cx="42" cy="19" r="6" fill="#febc2e"/>
    <circle cx="62" cy="19" r="6" fill="#28c840"/>
    <text x="231" y="24" text-anchor="middle" class="mono" font-size="12" fill="#64748b">martin@vps: ~</text>

    <g class="mono" font-size="14.5">
      <text x="22" y="72" class="line l1"><tspan fill="#34d399">❯</tspan><tspan fill="#e5e7eb"> whoami</tspan></text>
      <text x="22" y="96" class="line l2" fill="#94a3b8">martin · ingeniería de sistemas · 🇨🇴</text>
      <text x="22" y="128" class="line l3"><tspan fill="#34d399">❯</tspan><tspan fill="#e5e7eb"> docker ps --format "{{.Names}}"</tspan></text>
      <text x="22" y="152" class="line l4" fill="#22d3ee">cuscus-hats   reservatucancha   mesoft</text>
      <text x="22" y="176" class="line l5" fill="#22d3ee">agromanager   rently   monitor   bots</text>
      <text x="22" y="208" class="line l6"><tspan fill="#34d399">❯</tspan><tspan fill="#e5e7eb"> status</tspan></text>
      <text x="22" y="232" class="line l7"><tspan fill="#a3e635">● todo en producción</tspan><tspan fill="#e5e7eb" class="cursor"> ▌</tspan></text>
    </g>
  </g>
</svg>
